<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Multi-View - Fix 153</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0a0a0a;
      font-family: sans-serif;
      color: #fff;
    }
    #header {
      position: sticky;
      top: 0;
      background: #181818;
      padding: 10px;
      z-index: 999;
      border-bottom: 1px solid #333;
    }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #252525;
      color: #fff;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-start { background: #e62117; color: #fff; }
    .btn-clear { background: #333; color: #fff; }
    #status {
      font-size: 12px;
      color: #00ff88;
      display: block;
      margin-top: 6px;
      text-align: center;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      padding: 6px;
    }
    iframe {
      width: 100%;
      height: 95px;
      border: none;
      background: #000;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div id="header">
    <input type="text" id="ytInput" placeholder="YouTube Video Link ya ID yahan daalein">
    <div class="btn-group">
      <button class="btn-start" onclick="loadTabs(100)">Play 100 Tabs</button>
      <button class="btn-clear" onclick="clearAll()">Stop All</button>
    </div>
    <span id="status">Ready</span>
  </div>

  <div id="grid"></div>

  <script>
    function extractVideoId(url) {
      url = url.trim();
      if (url.includes('v=')) {
        return url.split('v=')[1].split('&')[0];
      } else if (url.includes('youtu.be/')) {
        return url.split('youtu.be/')[1].split('?')[0];
      } else if (url.includes('shorts/')) {
        return url.split('shorts/')[1].split('?')[0];
      }
      return url;
    }

    function loadTabs(total) {
      const input = document.getElementById('ytInput').value;
      const videoId = extractVideoId(input);
      const grid = document.getElementById('grid');
      const status = document.getElementById('status');

      if (!videoId) {
        alert("Valid YouTube Link daalein!");
        return;
      }

      grid.innerHTML = "";
      status.innerText = "Connecting...";

      // Error 153 fix parameters:
      const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&playsinline=1&rel=0&enablejsapi=1`;

      let loaded = 0;
      const batch = 5;

      function spawn() {
        for (let i = 0; i < batch && loaded < total; i++, loaded++) {
          const frame = document.createElement('iframe');
          frame.src = embedUrl;
          frame.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture');
          frame.setAttribute('allowfullscreen', 'true');
          grid.appendChild(frame);
        }

        status.innerText = `Active Streams: ${loaded} / ${total}`;

        if (loaded < total) {
          setTimeout(spawn, 350);
        } else {
          status.innerText = `Sabhi ${total} streams chal rahi hain!`;
        }
      }

      spawn();
    }

    function clearAll() {
      document.getElementById('grid').innerHTML = "";
      document.getElementById('status').innerText = "Stopped & Cleared";
    }
  </script>
</body>
</html>
